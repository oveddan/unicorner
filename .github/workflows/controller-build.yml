name: controller build

on:
  push:
    branches: [main]
    paths:
      - 'controller/**'
      - '.github/workflows/controller-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'controller/**'
      - '.github/workflows/controller-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: controller/package-lock.json
      - run: npm ci
      - run: npm run build
