name: Claude Code Review

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request. Focus on:
            - Correctness and likely bugs
            - Security issues (secrets, injection, unsafe input handling)
            - Adherence to patterns already used in the codebase
            - Anything that breaks the hackathon project's POC discipline (see CLAUDE.md)

            Be concise. Skip nits. Don't restate what the diff already shows.

            Ignore changes to: vendor/, dist/, build/, node_modules/,
            package-lock.json, *.toe, *.tox, *.[0-9].toe, *.[0-9][0-9].toe.
          claude_args: |
            --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
